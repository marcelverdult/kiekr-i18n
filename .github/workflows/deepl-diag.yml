name: deepl-diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Mask key
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: echo "::add-mask::$DEEPL_API_KEY"
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install deepl
      - name: Diag
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python tools/deepl_diag.py
